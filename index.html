<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yertle — Quadruped Robot</title>
  <style>
    :root {
      --bg: #111318;
      --text: #eef1f6;
      --muted: #9aa3b5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      padding: 32px;
    }
    main { max-width: 42rem; }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(2.4rem, 6vw, 4rem);
      letter-spacing: -0.04em;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.15rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>Yertle</h1>
    <p>A 3D-printed quadrupedal robot for locomotion research. Media coming soon.</p>
  </main>
</body>
</html>
